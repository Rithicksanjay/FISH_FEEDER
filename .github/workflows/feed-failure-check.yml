name: Feed Failure Checker

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.parse
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"

          def firebase_get(path):
              url = DB_URL + path + ".json"
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode())

          def firebase_put(path, data):
              url = DB_URL + path + ".json"
              body = json.dumps(data).encode()
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          def firebase_post(path, data):
              url = DB_URL + path + ".json"
              body = json.dumps(data).encode()
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          # --------------------------------------------------
          # GET DATA
          # --------------------------------------------------

          schedules = firebase_get("/schedules")
          last_seen = firebase_get("/device/lastSeen")

          print("Firebase Authentication: SUCCESS")
          print("Schedules:", schedules)
          print("Last Wemos heartbeat:", last_seen)

          # --------------------------------------------------
          # CURRENT IST TIME
          # --------------------------------------------------

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)

          print("Current IST:", now.strftime("%Y-%m-%d %H:%M"))

          # --------------------------------------------------
          # WEMOS ONLINE CHECK
          # --------------------------------------------------

          wemos_online = False

          if last_seen:
              last_seen_dt = datetime.fromtimestamp(
                  float(last_seen) / 1000,
                  tz=IST
              )

              seconds_since_heartbeat = (
                  now - last_seen_dt
              ).total_seconds()

              print(
                  "Seconds since heartbeat:",
                  int(seconds_since_heartbeat)
              )

              # Wemos heartbeat is every 5 seconds.
              # 15 minutes = 900 seconds.
              if 0 <= seconds_since_heartbeat <= 900:
                  wemos_online = True

          print("Wemos online:", wemos_online)

          # --------------------------------------------------
          # CHECK RECENT SCHEDULES
          # --------------------------------------------------

          if not schedules:
              print("No schedules found.")
              print("Feed failure check completed.")
              raise SystemExit(0)

          current_total_minutes = now.hour * 60 + now.minute

          # Check the current minute and previous 5 minutes.
          # This handles GitHub Actions running late.
          minutes_to_check = set()

          for offset in range(0, 6):
              check_total = current_total_minutes - offset
              check_total %= 1440

              hour = check_total // 60
              minute = check_total % 60

              minutes_to_check.add(
                  f"{hour:02d}:{minute:02d}"
              )

          print("Checking schedule window:", sorted(minutes_to_check))

          # --------------------------------------------------
          # PREVENT DUPLICATE FAILURE HISTORY
          # --------------------------------------------------

          checked = firebase_get("/feedFailureChecks")

          if not isinstance(checked, dict):
              checked = {}

          # --------------------------------------------------
          # PROCESS SCHEDULES
          # --------------------------------------------------

          for key, schedule_time in schedules.items():

              if not isinstance(schedule_time, str):
                  continue

              schedule_time = schedule_time.strip()

              if schedule_time not in minutes_to_check:
                  continue

              # Unique ID for this scheduled occurrence.
              occurrence_id = (
                  now.strftime("%Y-%m-%d") + "_" + schedule_time
              )

              if checked.get(occurrence_id) is True:
                  print(
                      "Already checked:",
                      schedule_time
                  )
                  continue

              print(
                  "Checking scheduled feed:",
                  schedule_time
              )

              # ------------------------------------------------
              # WEMOS ONLINE
              # ------------------------------------------------

              if wemos_online:

                  print(
                      "Wemos is online. "
                      "No Feed Failed message."
                  )

                  checked[occurrence_id] = True

                  firebase_put(
                      "/feedFailureChecks/" + occurrence_id,
                      True
                  )

              # ------------------------------------------------
              # WEMOS OFFLINE
              # ------------------------------------------------

              else:

                  print(
                      "Wemos is offline."
                  )

                  failure = {
                      "name": "Feed Failed",
                      "time": int(now.timestamp() * 1000),
                      "schedule": schedule_time
                  }

                  firebase_post(
                      "/history",
                      failure
                  )

                  firebase_put(
                      "/feedFailureChecks/" + occurrence_id,
                      True
                  )

                  print(
                      "Feed Failed added to history:",
                      schedule_time
                  )

          print("Feed failure check completed.")
          PY