name: Feed Failure Checker

on:
  workflow_dispatch:

concurrency:
  group: feed-failure-checker
  cancel-in-progress: false

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = os.environ["FIREBASE_DB_URL"]
          FIREBASE_EMAIL = os.environ["FIREBASE_EMAIL"]
          FIREBASE_PASSWORD = os.environ["FIREBASE_PASSWORD"]
          FIREBASE_API_KEY = os.environ["FIREBASE_API_KEY"]

          IST = timezone(timedelta(hours=5, minutes=30))

          def firebase_login():
              url = (
                  "https://identitytoolkit.googleapis.com/v1/"
                  "accounts:signInWithPassword?key="
                  + FIREBASE_API_KEY
              )

              data = json.dumps({
                  "email": FIREBASE_EMAIL,
                  "password": FIREBASE_PASSWORD,
                  "returnSecureToken": True
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.loads(response.read().decode())

              return result["idToken"]

          FIREBASE_ID_TOKEN = firebase_login()

          print("Firebase Authentication: SUCCESS")

          def firebase_get(path):
              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              req = urllib.request.Request(url)

              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(response.read().decode())

          def firebase_put(path, data):
              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          def firebase_post(path, data):
              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          def parse_time(value):
              if value is None:
                  return None

              try:
                  if isinstance(value, (int, float)):
                      return datetime.fromtimestamp(
                          float(value) / 1000,
                          tz=IST
                      )

                  if isinstance(value, str):
                      text = value.strip()

                      if not text:
                          return None

                      if text.endswith("Z"):
                          text = text[:-1] + "+00:00"

                      dt = datetime.fromisoformat(text)

                      if dt.tzinfo is None:
                          return dt.replace(tzinfo=IST)

                      return dt.astimezone(IST)

              except Exception:
                  return None

              return None

          now = datetime.now(IST)

          print(
              "Current IST:",
              now.strftime("%Y-%m-%d %H:%M:%S")
          )

          schedules = firebase_get("/schedules")
          history = firebase_get("/history")
          checked = firebase_get("/feedFailureChecks")
          last_run_raw = firebase_get(
              "/feedFailureChecker/lastRunAt"
          )

          if not isinstance(schedules, (dict, list)):
              schedules = {}

          if not isinstance(history, dict):
              history = {}

          if not isinstance(checked, dict):
              checked = {}

          print("Schedules:", schedules)
          print("History entries:", len(history))

          last_run = parse_time(last_run_raw)

          if last_run is None:
              window_start = now - timedelta(minutes=15)
              print("No previous checker run found.")
          else:
              window_start = last_run - timedelta(minutes=10)

              print(
                  "Previous checker run:",
                  last_run.strftime("%Y-%m-%d %H:%M:%S")
              )

          process_until = now - timedelta(minutes=1)

          print(
              "Processing from:",
              window_start.strftime("%Y-%m-%d %H:%M:%S")
          )

          print(
              "Processing until:",
              process_until.strftime("%Y-%m-%d %H:%M:%S")
          )

          if process_until <= window_start:
              print("Nothing ready to process.")

              firebase_put(
                  "/feedFailureChecker/lastRunAt",
                  now.isoformat()
              )

              raise SystemExit(0)

          schedule_times = []

          if isinstance(schedules, dict):
              values = schedules.values()
          else:
              values = schedules

          for value in values:
              if not isinstance(value, str):
                  continue

              value = value.strip()

              if len(value) != 5 or value[2] != ":":
                  continue

              try:
                  hour = int(value[:2])
                  minute = int(value[3:5])

                  if 0 <= hour <= 23 and 0 <= minute <= 59:
                      schedule_times.append(value)

              except ValueError:
                  continue

          schedule_times = sorted(set(schedule_times))

          print("Schedule times:", schedule_times)

          if not schedule_times:
              print("No schedules found.")

              firebase_put(
                  "/feedFailureChecker/lastRunAt",
                  now.isoformat()
              )

              raise SystemExit(0)

          automatic_feeds = []

          for entry in history.values():
              if not isinstance(entry, dict):
                  continue

              name = str(
                  entry.get("name", "")
              ).strip()

              if name not in (
                  "Automatic",
                  "Automatic Feed"
              ):
                  continue

              feed_dt = parse_time(
                  entry.get("time")
              )

              if feed_dt is not None:
                  automatic_feeds.append(feed_dt)

          print(
              "Automatic feed records:",
              len(automatic_feeds)
          )

          def automatic_feed_exists(scheduled_dt):
              for feed_dt in automatic_feeds:
                  if (
                      feed_dt.year == scheduled_dt.year
                      and feed_dt.month == scheduled_dt.month
                      and feed_dt.day == scheduled_dt.day
                      and feed_dt.hour == scheduled_dt.hour
                      and feed_dt.minute == scheduled_dt.minute
                  ):
                      print(
                          "Automatic Feed FOUND:",
                          scheduled_dt.strftime(
                              "%Y-%m-%d %H:%M"
                          )
                      )

                      return True

              return False

          current_date = window_start.date()
          final_date = process_until.date()

          while current_date <= final_date:

              for schedule_time in schedule_times:
                  hour = int(schedule_time[:2])
                  minute = int(schedule_time[3:5])

                  scheduled_dt = datetime(
                      current_date.year,
                      current_date.month,
                      current_date.day,
                      hour,
                      minute,
                      0,
                      tzinfo=IST
                  )

                  if scheduled_dt <= window_start:
                      continue

                  if scheduled_dt > process_until:
                      continue

                  occurrence_id = (
                      scheduled_dt.strftime("%Y-%m-%d")
                      + "_"
                      + schedule_time
                  )

                  print(
                      "Checking:",
                      occurrence_id
                  )

                  if checked.get(occurrence_id) is True:
                      print("Already processed.")
                      continue

                  if automatic_feed_exists(scheduled_dt):
                      print("RESULT: AUTOMATIC FEED")

                      firebase_put(
                          "/feedFailureChecks/"
                          + occurrence_id,
                          True
                      )

                      continue

                  print("RESULT: FEED FAILED")

                  failure = {
                      "name": "Feed Failed",
                      "time": int(
                          scheduled_dt.timestamp() * 1000
                      ),
                      "schedule": schedule_time
                  }

                  firebase_post(
                      "/history",
                      failure
                  )

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  print(
                      "Feed Failed added:",
                      schedule_time
                  )

              current_date += timedelta(days=1)

          firebase_put(
              "/feedFailureChecker/lastRunAt",
              now.isoformat()
          )

          print("Feed failure check completed.")

          print(
              "Last checker time:",
              now.isoformat()
          )
          PY