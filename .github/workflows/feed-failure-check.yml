name: Feed Failure Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check missed scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = os.environ["FIREBASE_DB_URL"]
          FIREBASE_EMAIL = os.environ["FIREBASE_EMAIL"]
          FIREBASE_PASSWORD = os.environ["FIREBASE_PASSWORD"]
          FIREBASE_API_KEY = os.environ["FIREBASE_API_KEY"]

          # --------------------------------------------------
          # FIREBASE LOGIN
          # --------------------------------------------------

          def firebase_login():

              url = (
                  "https://identitytoolkit.googleapis.com/v1/"
                  "accounts:signInWithPassword?key="
                  + FIREBASE_API_KEY
              )

              data = json.dumps({
                  "email": FIREBASE_EMAIL,
                  "password": FIREBASE_PASSWORD,
                  "returnSecureToken": True
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  result = json.loads(
                      response.read().decode()
                  )

              return result["idToken"]

          FIREBASE_ID_TOKEN = firebase_login()

          print("Firebase Authentication: SUCCESS")

          # --------------------------------------------------
          # FIREBASE GET
          # --------------------------------------------------

          def firebase_get(path):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              req = urllib.request.Request(url)

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )

          # --------------------------------------------------
          # FIREBASE PUT
          # --------------------------------------------------

          def firebase_put(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # FIREBASE POST
          # --------------------------------------------------

          def firebase_post(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # IST TIME
          # --------------------------------------------------

          IST = timezone(
              timedelta(hours=5, minutes=30)
          )

          now = datetime.now(IST)

          print(
              "Current IST:",
              now.strftime("%Y-%m-%d %H:%M:%S")
          )

          # --------------------------------------------------
          # GET FIREBASE DATA
          # --------------------------------------------------

          schedules = firebase_get("/schedules")
          last_seen = firebase_get("/device/lastSeen")
          checked = firebase_get("/feedFailureChecks")

          print("Schedules:", schedules)
          print("Last Wemos heartbeat:", last_seen)

          if not isinstance(checked, dict):
              checked = {}

          # --------------------------------------------------
          # WEMOS ONLINE CHECK
          # --------------------------------------------------

          wemos_online = False

          if last_seen:

              try:

                  last_seen_dt = datetime.fromtimestamp(
                      float(last_seen) / 1000,
                      tz=IST
                  )

                  seconds_since_heartbeat = (
                      now - last_seen_dt
                  ).total_seconds()

                  print(
                      "Seconds since heartbeat:",
                      int(seconds_since_heartbeat)
                  )

                  # Wemos is considered online if a heartbeat
                  # was received within the last 15 minutes.

                  if 0 <= seconds_since_heartbeat <= 900:
                      wemos_online = True

              except Exception as error:

                  print(
                      "Heartbeat parsing error:",
                      error
                  )

          print(
              "Wemos online:",
              wemos_online
          )

          # --------------------------------------------------
          # NO SCHEDULES
          # --------------------------------------------------

          if not schedules:

              print("No schedules found.")
              print("Feed failure check completed.")

              raise SystemExit(0)

          # --------------------------------------------------
          # NORMALIZE SCHEDULES
          # --------------------------------------------------

          schedule_times = []

          if isinstance(schedules, list):

              for item in schedules:

                  if isinstance(item, str):
                      schedule_times.append(
                          item.strip()
                      )

          elif isinstance(schedules, dict):

              for value in schedules.values():

                  if isinstance(value, str):
                      schedule_times.append(
                          value.strip()
                      )

          print(
              "Schedule times:",
              schedule_times
          )

          # --------------------------------------------------
          # CHECK MISSED SCHEDULES
          # --------------------------------------------------

          #
          # GitHub Actions may start late.
          #
          # Instead of checking only the current minute,
          # look back through the previous 24 HOURS.
          #
          # This means a delayed GitHub run can still find
          # a schedule that was missed while the website
          # was closed.
          #

          start_of_window = now - timedelta(
              hours=24
          )

          print(
              "Checking missed schedules from:",
              start_of_window.strftime(
                  "%Y-%m-%d %H:%M"
              ),
              "to:",
              now.strftime(
                  "%Y-%m-%d %H:%M"
              )
          )

          # --------------------------------------------------
          # PROCESS EACH SCHEDULE
          # --------------------------------------------------

          for schedule_time in schedule_times:

              if not schedule_time:
                  continue

              try:

                  schedule_hour, schedule_minute = map(
                      int,
                      schedule_time.split(":")
                  )

              except Exception:

                  print(
                      "Invalid schedule:",
                      schedule_time
                  )

                  continue

              # ------------------------------------------------
              # CHECK TODAY'S OCCURRENCE
              # ------------------------------------------------

              scheduled_dt = datetime(
                  now.year,
                  now.month,
                  now.day,
                  schedule_hour,
                  schedule_minute,
                  tzinfo=IST
              )

              # If today's scheduled time is still in the future,
              # there is nothing to process yet.

              if scheduled_dt > now:

                  print(
                      "Future schedule:",
                      schedule_time
                  )

                  continue

              # If today's occurrence is older than 24 hours,
              # don't process it.

              if scheduled_dt < start_of_window:

                  continue

              occurrence_id = (
                  scheduled_dt.strftime("%Y-%m-%d")
                  + "_"
                  + schedule_time
              )

              # ------------------------------------------------
              # DUPLICATE PROTECTION
              # ------------------------------------------------

              if checked.get(occurrence_id) is True:

                  print(
                      "Already processed:",
                      occurrence_id
                  )

                  continue

              print()
              print(
                  "========================================"
              )

              print(
                  "MISSED SCHEDULE FOUND:",
                  schedule_time
              )

              print(
                  "Scheduled time:",
                  scheduled_dt.strftime(
                      "%Y-%m-%d %H:%M"
                  )
              )

              print(
                  "========================================"
              )

              # ------------------------------------------------
              # IMPORTANT:
              #
              # Only mark Feed Failed if the Wemos was OFFLINE.
              #
              # If Wemos is online, the Wemos itself is expected
              # to handle the scheduled feed.
              # ------------------------------------------------

              if wemos_online:

                  print(
                      "Wemos is online."
                  )

                  print(
                      "No Feed Failed entry created."
                  )

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

              else:

                  print(
                      "Wemos is OFFLINE."
                  )

                  failure = {
                      "name": "Feed Failed",
                      "time": int(
                          scheduled_dt.timestamp() * 1000
                      ),
                      "schedule": schedule_time
                  }

                  firebase_post(
                      "/history",
                      failure
                  )

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  print(
                      "Feed Failed added to Firebase history:",
                      schedule_time
                  )

          print()
          print(
              "========================================"
          )

          print(
              "Feed failure check completed."
          )

          print(
              "========================================"
          )

          PY