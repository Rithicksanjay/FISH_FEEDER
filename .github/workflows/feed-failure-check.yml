name: Feed Failure Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check missed scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = os.environ["FIREBASE_DB_URL"]
          FIREBASE_EMAIL = os.environ["FIREBASE_EMAIL"]
          FIREBASE_PASSWORD = os.environ["FIREBASE_PASSWORD"]
          FIREBASE_API_KEY = os.environ["FIREBASE_API_KEY"]

          # --------------------------------------------------
          # FIREBASE LOGIN
          # --------------------------------------------------

          def firebase_login():

              url = (
                  "https://identitytoolkit.googleapis.com/v1/"
                  "accounts:signInWithPassword?key="
                  + FIREBASE_API_KEY
              )

              data = json.dumps({
                  "email": FIREBASE_EMAIL,
                  "password": FIREBASE_PASSWORD,
                  "returnSecureToken": True
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  result = json.loads(
                      response.read().decode()
                  )

              return result["idToken"]

          FIREBASE_ID_TOKEN = firebase_login()

          print("Firebase Authentication: SUCCESS")

          # --------------------------------------------------
          # FIREBASE GET
          # --------------------------------------------------

          def firebase_get(path):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              req = urllib.request.Request(url)

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )

          # --------------------------------------------------
          # FIREBASE PUT
          # --------------------------------------------------

          def firebase_put(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # FIREBASE POST
          # --------------------------------------------------

          def firebase_post(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # CURRENT IST TIME
          # --------------------------------------------------

          IST = timezone(
              timedelta(hours=5, minutes=30)
          )

          now = datetime.now(IST)

          print(
              "Current IST:",
              now.strftime("%Y-%m-%d %H:%M:%S")
          )

          # --------------------------------------------------
          # GET FIREBASE DATA
          # --------------------------------------------------

          schedules = firebase_get("/schedules")
          last_seen = firebase_get("/device/lastSeen")
          checked = firebase_get("/feedFailureChecks")
          history = firebase_get("/history")

          if not isinstance(checked, dict):
              checked = {}

          if not isinstance(history, dict):
              history = {}

          print("Schedules:", schedules)
          print("Last Wemos heartbeat:", last_seen)

          # --------------------------------------------------
          # WEMOS ONLINE CHECK
          # --------------------------------------------------

          wemos_online = False

          if last_seen:

              try:

                  last_seen_dt = datetime.fromtimestamp(
                      float(last_seen) / 1000,
                      tz=IST
                  )

                  seconds_since_heartbeat = (
                      now - last_seen_dt
                  ).total_seconds()

                  print(
                      "Seconds since heartbeat:",
                      int(seconds_since_heartbeat)
                  )

                  # Same 15-minute offline threshold
                  # used by the website.

                  if 0 <= seconds_since_heartbeat <= 900:
                      wemos_online = True

              except Exception as error:

                  print(
                      "Heartbeat parsing error:",
                      error
                  )

          print(
              "Wemos online:",
              wemos_online
          )

          # --------------------------------------------------
          # NORMALIZE SCHEDULES
          # --------------------------------------------------

          schedule_times = []

          if isinstance(schedules, list):

              for item in schedules:

                  if isinstance(item, str):

                      schedule_times.append(
                          item.strip()
                      )

          elif isinstance(schedules, dict):

              for value in schedules.values():

                  if isinstance(value, str):

                      schedule_times.append(
                          value.strip()
                      )

          print(
              "Schedule times:",
              schedule_times
          )

          if not schedule_times:

              print("No schedules found.")
              raise SystemExit(0)

          # --------------------------------------------------
          # PROCESS TODAY'S SCHEDULES
          # --------------------------------------------------

          for schedule_time in schedule_times:

              try:

                  hour, minute = map(
                      int,
                      schedule_time.split(":")
                  )

                  if hour < 0 or hour > 23:
                      continue

                  if minute < 0 or minute > 59:
                      continue

              except Exception:

                  print(
                      "Invalid schedule:",
                      schedule_time
                  )

                  continue

              scheduled_dt = datetime(
                  now.year,
                  now.month,
                  now.day,
                  hour,
                  minute,
                  tzinfo=IST
              )

              # Future schedule
              if scheduled_dt > now:

                  print(
                      "Future schedule:",
                      schedule_time
                  )

                  continue

              occurrence_id = (
                  scheduled_dt.strftime("%Y-%m-%d")
                  + "_"
                  + schedule_time
              )

              # ------------------------------------------------
              # ALREADY CHECKED
              # ------------------------------------------------

              if checked.get(occurrence_id) is True:

                  print(
                      "Already checked:",
                      occurrence_id
                  )

                  continue

              print()
              print(
                  "========================================"
              )

              print(
                  "PROCESSING:",
                  occurrence_id
              )

              # ------------------------------------------------
              # CHECK WHETHER AUTOMATIC FEED ALREADY HAPPENED
              # ------------------------------------------------

              automatic_feed_found = False

              for history_key, entry in history.items():

                  if not isinstance(entry, dict):
                      continue

                  if entry.get("name") != "Automatic Feed":
                      continue

                  history_time = entry.get("time")

                  if history_time is None:
                      continue

                  try:

                      history_dt = datetime.fromtimestamp(
                          float(history_time) / 1000,
                          tz=IST
                      )

                  except Exception:

                      continue

                  # Match today's schedule within 2 minutes.

                  if (
                      history_dt.date()
                      == scheduled_dt.date()
                      and
                      history_dt.hour
                      == scheduled_dt.hour
                      and
                      abs(
                          history_dt.minute
                          - scheduled_dt.minute
                      ) <= 2
                  ):

                      automatic_feed_found = True

                      print(
                          "Automatic Feed already found for:",
                          schedule_time
                      )

                      break

              # ------------------------------------------------
              # AUTOMATIC FEED ALREADY COMPLETED
              # ------------------------------------------------

              if automatic_feed_found:

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  print(
                      "Marked as checked."
                  )

                  continue

              # ------------------------------------------------
              # WEMOS ONLINE
              # ------------------------------------------------

              if wemos_online:

                  print(
                      "Wemos is online."
                  )

                  print(
                      "No Feed Failed entry created."
                  )

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  continue

              # ------------------------------------------------
              # WEMOS OFFLINE
              # ------------------------------------------------

              print(
                  "Wemos is offline."
              )

              failure = {
                  "name": "Feed Failed",
                  "time": int(
                      scheduled_dt.timestamp() * 1000
                  ),
                  "schedule": schedule_time
              }

              firebase_post(
                  "/history",
                  failure
              )

              firebase_put(
                  "/feedFailureChecks/"
                  + occurrence_id,
                  True
              )

              print(
                  "Feed Failed added:",
                  schedule_time
              )

          print()
          print(
              "========================================"
          )

          print(
              "Feed failure check completed."
          )

          print(
              "========================================"
          )

          PY