name: Feed Failure Checker

on:
  workflow_dispatch:

concurrency:
  group: feed-failure-checker
  cancel-in-progress: false

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = os.environ["FIREBASE_DB_URL"]
          FIREBASE_EMAIL = os.environ["FIREBASE_EMAIL"]
          FIREBASE_PASSWORD = os.environ["FIREBASE_PASSWORD"]
          FIREBASE_API_KEY = os.environ["FIREBASE_API_KEY"]

          IST = timezone(
              timedelta(hours=5, minutes=30)
          )

          # --------------------------------------------------
          # FIREBASE LOGIN
          # --------------------------------------------------

          def firebase_login():

              url = (
                  "https://identitytoolkit.googleapis.com/v1/"
                  "accounts:signInWithPassword?key="
                  + FIREBASE_API_KEY
              )

              data = json.dumps({
                  "email": FIREBASE_EMAIL,
                  "password": FIREBASE_PASSWORD,
                  "returnSecureToken": True
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  result = json.loads(
                      response.read().decode()
                  )

              return result["idToken"]

          FIREBASE_ID_TOKEN = firebase_login()

          print("Firebase Authentication: SUCCESS")

          # --------------------------------------------------
          # FIREBASE GET
          # --------------------------------------------------

          def firebase_get(path):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              req = urllib.request.Request(url)

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return json.loads(
                      response.read().decode()
                  )

          # --------------------------------------------------
          # FIREBASE PUT
          # --------------------------------------------------

          def firebase_put(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # FIREBASE POST
          # --------------------------------------------------

          def firebase_post(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=15
              ) as response:

                  return response.read().decode()

          # --------------------------------------------------
          # PARSE FIREBASE TIME
          # --------------------------------------------------

          def parse_time(value):

              if value is None:
                  return None

              try:

                  if isinstance(value, (int, float)):

                      return datetime.fromtimestamp(
                          float(value) / 1000,
                          tz=IST
                      )

                  if isinstance(value, str):

                      text = value.strip()

                      if not text:
                          return None

                      if text.endswith("Z"):
                          text = text[:-1] + "+00:00"

                      dt = datetime.fromisoformat(text)

                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=IST)
                      else:
                          dt = dt.astimezone(IST)

                      return dt

              except Exception:
                  return None

              return None

          # --------------------------------------------------
          # CURRENT TIME
          # --------------------------------------------------

          now = datetime.now(IST)

          print(
              "Current IST:",
              now.strftime("%Y-%m-%d %H:%M:%S")
          )

          # --------------------------------------------------
          # READ FIREBASE
          # --------------------------------------------------

          schedules = firebase_get("/schedules")
          history = firebase_get("/history")
          checked = firebase_get("/feedFailureChecks")
          last_run_raw = firebase_get(
              "/feedFailureChecker/lastRunAt"
          )

          if not isinstance(checked, dict):
              checked = {}

          if not isinstance(history, dict):
              history = {}

          print("Schedules:", schedules)
          print("History entries:", len(history))

          # --------------------------------------------------
          # FIND PREVIOUS CHECK
          # --------------------------------------------------

          last_run = parse_time(last_run_raw)

          if last_run is None:

              # First run after installing this version.
              # Only inspect the last 15 minutes so old
              # schedules are not suddenly processed.

              window_start = now - timedelta(
                  minutes=15
              )

              print(
                  "No previous checker run found."
              )

          else:

              window_start = last_run

              print(
                  "Previous checker run:",
                  last_run.strftime(
                      "%Y-%m-%d %H:%M:%S"
                  )
              )

          # --------------------------------------------------
          # WAIT 1 MINUTE BEFORE DECLARING FAILURE
          # --------------------------------------------------

          process_until = now - timedelta(
              minutes=1
          )

          if process_until <= window_start:

              print(
                  "No completed schedule window yet."
              )

              firebase_put(
                  "/feedFailureChecker/lastRunAt",
                  now.isoformat()
              )

              raise SystemExit(0)

          print(
              "Processing from:",
              window_start.strftime(
                  "%Y-%m-%d %H:%M:%S"
              )
          )

          print(
              "Processing until:",
              process_until.strftime(
                  "%Y-%m-%d %H:%M:%S"
              )
          )

          # --------------------------------------------------
          # NORMALIZE SCHEDULES
          # --------------------------------------------------

          schedule_times = []

          if isinstance(schedules, dict):

              for value in schedules.values():

                  if isinstance(value, str):

                      value = value.strip()

                      if len(value) == 5:
                          schedule_times.append(value)

          elif isinstance(schedules, list):

              for value in schedules:

                  if isinstance(value, str):

                      value = value.strip()

                      if len(value) == 5:
                          schedule_times.append(value)

          schedule_times = sorted(
              set(schedule_times)
          )

          print(
              "Schedule times:",
              schedule_times
          )

          if not schedule_times:

              print(
                  "No schedules found."
              )

              firebase_put(
                  "/feedFailureChecker/lastRunAt",
                  now.isoformat()
              )

              raise SystemExit(0)

          # --------------------------------------------------
          # BUILD SUCCESSFUL AUTOMATIC FEED LIST
          # --------------------------------------------------

          automatic_feeds = []

          for key, entry in history.items():

              if not isinstance(entry, dict):
                  continue

              name = str(
                  entry.get("name", "")
              ).strip()

              # Wemos writes "Automatic".
              # Older website versions may have written
              # "Automatic Feed".

              if name not in (
                  "Automatic",
                  "Automatic Feed"
              ):
                  continue

              feed_dt = parse_time(
                  entry.get("time")
              )

              if feed_dt is None:
                  continue

              automatic_feeds.append(feed_dt)

          print(
              "Automatic feed records:",
              len(automatic_feeds)
          )

          # --------------------------------------------------
          # CHECK SUCCESSFUL FEED
          # --------------------------------------------------

          def automatic_feed_exists(
              scheduled_dt
          ):

              # Allow up to 3 minutes difference.
              tolerance = 180

              for feed_dt in automatic_feeds:

                  difference = abs(
                      (
                          feed_dt
                          - scheduled_dt
                      ).total_seconds()
                  )

                  if difference <= tolerance:

                      print(
                          "Automatic Feed FOUND:",
                          scheduled_dt.strftime(
                              "%Y-%m-%d %H:%M"
                          ),
                          "actual:",
                          feed_dt.strftime(
                              "%Y-%m-%d %H:%M:%S"
                          )
                      )

                      return True

              return False

          # --------------------------------------------------
          # PROCESS MISSED SCHEDULE OCCURRENCES
          # --------------------------------------------------

          current_date = window_start.date()
          final_date = process_until.date()

          while current_date <= final_date:

              for schedule_time in schedule_times:

                  try:

                      hour = int(
                          schedule_time[:2]
                      )

                      minute = int(
                          schedule_time[3:5]
                      )

                      if (
                          hour < 0
                          or hour > 23
                          or minute < 0
                          or minute > 59
                      ):
                          continue

                  except Exception:

                      print(
                          "Invalid schedule:",
                          schedule_time
                      )

                      continue

                  scheduled_dt = datetime(
                      current_date.year,
                      current_date.month,
                      current_date.day,
                      hour,
                      minute,
                      0,
                      tzinfo=IST
                  )

                  # Only process a schedule that occurred
                  # AFTER the previous checker run.

                  if scheduled_dt <= window_start:
                      continue

                  # Do not process future schedules.

                  if scheduled_dt > process_until:
                      continue

                  occurrence_id = (
                      scheduled_dt.strftime(
                          "%Y-%m-%d"
                      )
                      + "_"
                      + schedule_time
                  )

                  print()
                  print(
                      "----------------------------------------"
                  )

                  print(
                      "Checking:",
                      occurrence_id
                  )

                  # ------------------------------------------------
                  # DUPLICATE PROTECTION
                  # ------------------------------------------------

                  if checked.get(
                      occurrence_id
                  ) is True:

                      print(
                          "Already processed."
                      )

                      continue

                  # ------------------------------------------------
                  # SUCCESSFUL AUTOMATIC FEED
                  # ------------------------------------------------

                  if automatic_feed_exists(
                      scheduled_dt
                  ):

                      print(
                          "RESULT: AUTOMATIC FEED"
                      )

                      print(
                          "No Feed Failed entry."
                      )

                      firebase_put(
                          "/feedFailureChecks/"
                          + occurrence_id,
                          True
                      )

                      continue

                  # ------------------------------------------------
                  # MISSED FEED
                  # ------------------------------------------------

                  print(
                      "RESULT: FEED FAILED"
                  )

                  failure = {
                      "name": "Feed Failed",
                      "time": int(
                          scheduled_dt.timestamp()
                          * 1000
                      ),
                      "schedule": schedule_time
                  }

                  firebase_post(
                      "/history",
                      failure
                  )

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  print(
                      "Feed Failed added:",
                      schedule_time
                  )

              current_date = (
                  current_date
                  + timedelta(days=1)
              )

          # --------------------------------------------------
          # SAVE CURRENT CHECK TIME
          # --------------------------------------------------

          firebase_put(
              "/feedFailureChecker/lastRunAt",
              now.isoformat()
          )

          print()
          print(
              "========================================"
          )

          print(
              "Feed failure check completed."
          )

          print(
              "Last checker time saved."
          )

          print(
              "========================================"
          )

          PY
