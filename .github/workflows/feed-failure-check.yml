name: Feed Failure Checker

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check scheduled feeds
        env:
          FIREBASE_DB_URL: "https://smartfeeder-v01-default-rtdb.asia-southeast1.firebasedatabase.app"
          FIREBASE_EMAIL: ${{ secrets.FIREBASE_EMAIL }}
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

        run: |
          python3 <<'PY'
          import os
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          DB_URL = os.environ["FIREBASE_DB_URL"]
          FIREBASE_EMAIL = os.environ["FIREBASE_EMAIL"]
          FIREBASE_PASSWORD = os.environ["FIREBASE_PASSWORD"]
          FIREBASE_API_KEY = os.environ["FIREBASE_API_KEY"]

          # --------------------------------------------------
          # FIREBASE LOGIN
          # --------------------------------------------------

          def firebase_login():

              url = (
                  "https://identitytoolkit.googleapis.com/v1/"
                  "accounts:signInWithPassword?key="
                  + FIREBASE_API_KEY
              )

              data = json.dumps({
                  "email": FIREBASE_EMAIL,
                  "password": FIREBASE_PASSWORD,
                  "returnSecureToken": True
              }).encode()

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.loads(
                      response.read().decode()
                  )

              return result["idToken"]

          FIREBASE_ID_TOKEN = firebase_login()

          print("Firebase Authentication: SUCCESS")

          # --------------------------------------------------
          # FIREBASE GET
          # --------------------------------------------------

          def firebase_get(path):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              req = urllib.request.Request(url)

              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.loads(
                      response.read().decode()
                  )

          # --------------------------------------------------
          # FIREBASE PUT
          # --------------------------------------------------

          def firebase_put(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="PUT",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          # --------------------------------------------------
          # FIREBASE POST
          # --------------------------------------------------

          def firebase_post(path, data):

              url = (
                  DB_URL
                  + path
                  + ".json?auth="
                  + FIREBASE_ID_TOKEN
              )

              body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=15) as response:
                  return response.read().decode()

          # --------------------------------------------------
          # GET FIREBASE DATA
          # --------------------------------------------------

          schedules = firebase_get("/schedules")
          history = firebase_get("/history")
          checked = firebase_get("/feedFailureChecks")

          if not isinstance(checked, dict):
              checked = {}

          if not isinstance(history, dict):
              history = {}

          print("Schedules:", schedules)
          print("History entries:", len(history))

          # --------------------------------------------------
          # CURRENT IST TIME
          # --------------------------------------------------

          IST = timezone(
              timedelta(hours=5, minutes=30)
          )

          now = datetime.now(IST)

          print(
              "Current IST:",
              now.strftime("%Y-%m-%d %H:%M")
          )

          # --------------------------------------------------
          # BUILD RECENT HISTORY
          # --------------------------------------------------

          automatic_feeds = []

          for key, entry in history.items():

              if not isinstance(entry, dict):
                  continue

              name = entry.get("name")

              if name != "Automatic Feed":
                  continue

              feed_time = entry.get("time")

              if feed_time is None:
                  continue

              try:
                  feed_dt = datetime.fromtimestamp(
                      float(feed_time) / 1000,
                      tz=IST
                  )

                  automatic_feeds.append(feed_dt)

              except Exception:
                  continue

          print(
              "Automatic feed records:",
              len(automatic_feeds)
          )

          # --------------------------------------------------
          # CHECK WHETHER AUTOMATIC FEED ACTUALLY HAPPENED
          # --------------------------------------------------

          def automatic_feed_exists(
              scheduled_date,
              schedule_time
          ):

              hour, minute = map(
                  int,
                  schedule_time.split(":")
              )

              scheduled_dt = datetime(
                  scheduled_date.year,
                  scheduled_date.month,
                  scheduled_date.day,
                  hour,
                  minute,
                  0,
                  tzinfo=IST
              )

              # Allow a small tolerance because the Wemos
              # may write the history a few seconds late.
              tolerance_seconds = 120

              for feed_dt in automatic_feeds:

                  difference = abs(
                      (feed_dt - scheduled_dt).total_seconds()
                  )

                  if difference <= tolerance_seconds:

                      print(
                          "Automatic Feed FOUND:",
                          schedule_time,
                          feed_dt.strftime(
                              "%Y-%m-%d %H:%M:%S"
                          )
                      )

                      return True

              return False

          # --------------------------------------------------
          # CHECK RECENT SCHEDULE WINDOW
          # --------------------------------------------------

          current_total_minutes = (
              now.hour * 60 + now.minute
          )

          minutes_to_check = set()

          # GitHub Actions may run late.
          # Check the current minute and previous
          # 15 minutes.

          for offset in range(0, 16):

              check_total = (
                  current_total_minutes - offset
              ) % 1440

              hour = check_total // 60
              minute = check_total % 60

              minutes_to_check.add(
                  f"{hour:02d}:{minute:02d}"
              )

          print(
              "Checking schedule window:",
              sorted(minutes_to_check)
          )

          # --------------------------------------------------
          # PROCESS SCHEDULES
          # --------------------------------------------------

          if not schedules:

              print("No schedules found.")
              print("Feed failure check completed.")
              raise SystemExit(0)

          for key, schedule_time in schedules.items():

              if not isinstance(schedule_time, str):
                  continue

              schedule_time = schedule_time.strip()

              if schedule_time not in minutes_to_check:
                  continue

              occurrence_id = (
                  now.strftime("%Y-%m-%d")
                  + "_"
                  + schedule_time
              )

              print(
                  "Checking scheduled feed:",
                  schedule_time
              )

              # ------------------------------------------------
              # ALREADY PROCESSED
              # ------------------------------------------------

              if checked.get(occurrence_id) is True:

                  print(
                      "Already checked:",
                      schedule_time
                  )

                  continue

              # ------------------------------------------------
              # IMPORTANT:
              # CHECK ACTUAL AUTOMATIC FEED HISTORY
              # ------------------------------------------------

              feed_happened = automatic_feed_exists(
                  now.date(),
                  schedule_time
              )

              if feed_happened:

                  print(
                      "Scheduled feed completed:",
                      schedule_time
                  )

                  # Mark as checked.
                  # DO NOT create Feed Failed.

                  firebase_put(
                      "/feedFailureChecks/"
                      + occurrence_id,
                      True
                  )

                  continue

              # ------------------------------------------------
              # NO AUTOMATIC FEED FOUND
              # ------------------------------------------------

              print(
                  "No Automatic Feed found:",
                  schedule_time
              )

              failure = {
                  "name": "Feed Failed",
                  "time": int(
                      datetime(
                          now.year,
                          now.month,
                          now.day,
                          int(schedule_time[:2]),
                          int(schedule_time[3:]),
                          0,
                          tzinfo=IST
                      ).timestamp() * 1000
                  ),
                  "schedule": schedule_time
              }

              firebase_post(
                  "/history",
                  failure
              )

              firebase_put(
                  "/feedFailureChecks/"
                  + occurrence_id,
                  True
              )

              print(
                  "Feed Failed added:",
                  schedule_time
              )

          print(
              "Feed failure check completed."
          )

          PY